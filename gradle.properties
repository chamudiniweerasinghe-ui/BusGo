# --- AGP 9 compatibility -------------------------------------------------
# AGP 9 turns on a new DSL and its own built-in Kotlin compilation by default,
# which makes the org.jetbrains.kotlin.android plugin incompatible.
# These two lines keep the AGP 8-style build files working.
# Google removes this opt-out in AGP 10, so migrating later means deleting
# these lines, removing the kotlin.android plugin, and moving kotlinOptions
# into a top-level kotlin { compilerOptions { } } block.
android.newDsl=false
android.builtInKotlin=false
